<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FaithConnect — Single Christians</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <main class="single-christians-page">

    <div class="single-christians-header">

      <button
        type="button"
        id="singleChristiansHomeBtn"
        class="single-christians-home-btn"
      >
        ← Home
      </button>

      <h1>💛 Looking for God's Will?</h1>

      <p>Single Christians</p>

      <span>
        Connect with Christian singles who are
        seeking God's will for their future.
      </span>

    </div>


    <!-- =====================================
         PROFILES WILL APPEAR HERE
    ====================================== -->

    <section
      id="singleChristiansList"
      class="single-christians-list"
    >

      <div class="single-christians-empty">

        <div class="single-empty-icon">
          💛
        </div>

        <h2>Single Christian Profiles</h2>

        <p>
          Profiles will appear here.
        </p>

      </div>

    </section>


    <!-- =====================================
         CREATE MY PROFILE
    ====================================== -->

    <section class="single-create-profile-card">

      <h2>Are you a single Christian?</h2>

      <p>
        Create your profile and share your
        information with other Christian singles.
      </p>

      <button
        type="button"
        id="createSingleProfileBtn"
        class="gods-will-btn"
      >
        🙏 Create My Profile
      </button>

    </section>

  </main>


  <script src="new-feature.js"></script>

</body>

</html>
