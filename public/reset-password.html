<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | FaithConnect</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .reset-container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #8b5cf6;
      text-decoration: none;
    }

  </style>

</head>

<body>

  <div class="reset-container">

    <h1>Reset Password</h1>

    <p>
      Enter your new password below.
    </p>

    <form id="resetPasswordForm">

      <label for="newPassword">
        New Password
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <div
        id="resetMessage"
        class="message"
      ></div>

      <button
        type="submit"
        id="resetPasswordBtn"
      >
        Reset Password
      </button>

    </form>

    <a
      href="/"
      class="back-login"
    >
      ← Back to Login
    </a>

  </div>

  <script>

    const form =
      document.getElementById("resetPasswordForm");

    const message =
      document.getElementById("resetMessage");

    const button =
      document.getElementById("resetPasswordBtn");

    const params =
      new URLSearchParams(window.location.search);

    const token =
      params.get("token");

    if (!token) {

      message.style.display = "block";
      message.className = "message error";
      message.textContent =
        "This password reset link is invalid or incomplete.";

      button.disabled = true;
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 6) {

        message.style.display = "block";
        message.className = "message error";
        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }

      if (newPassword !== confirmPassword) {

        message.style.display = "block";
        message.className = "message error";
        message.textContent =
          "The passwords do not match.";

        return;
      }

      button.disabled = true;
      button.textContent = "Resetting...";

      try {

        const response = await fetch(
          "/api/auth/reset-password",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              token,
              newPassword
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {

          message.style.display = "block";
          message.className = "message error";
          message.textContent =
            data.message ||
            "Unable to reset password.";

          button.disabled = false;
          button.textContent = "Reset Password";

          return;
        }

        message.style.display = "block";
        message.className = "message success";
        message.textContent =
          "Password changed successfully! You can now log in.";

        button.style.display = "none";

        document.getElementById("newPassword").disabled = true;
        document.getElementById("confirmPassword").disabled = true;

      } catch (error) {

        console.error(
          "RESET PASSWORD ERROR:",
          error
        );

        message.style.display = "block";
        message.className = "message error";
        message.textContent =
          "Unable to connect to the server.";

        button.disabled = false;
        button.textContent = "Reset Password";
      }

    });

  </script>

</body>

</html>
